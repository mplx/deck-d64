#
# The gate: version injection, formatting, lint, the drift guards, the
# white-box suites, and every example running. Runs on every commit, on every
# branch, and on every pull request. Tags are skipped - release.yml runs the
# same gate in front of a release.
#
# Everything a deck differs in - manifest format, module or topics shape,
# whether it claims jennifer-tiny - is discovered by tools/deck-lib.sh.

name: test

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: fmt, lint, guards, tests, examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # tools/version.sh needs the tag history to derive a version.
          fetch-depth: 0

      # The image follows the deck's floor: a deck pinned to a released series
      # is tested on that release, because a dev build bypasses the floor.
      - name: Resolve the interpreter image
        run: |
          set -euo pipefail
          source tools/deck-lib.sh && deck_load
          image="$(deck_image)"
          echo "JENNIFER_IMAGE=${image}" >> "$GITHUB_ENV"
          echo "floor ${DECK_FLOOR} -> ${image}"

      - name: Pull the interpreter image
        run: docker pull "$JENNIFER_IMAGE"

      - name: Report the interpreter version
        run: docker run --rm "$JENNIFER_IMAGE" version

      # A shim so every later step is one word. --user keeps anything written
      # into the workspace owned by the runner.
      - name: Install a `jennifer` shim that runs the image
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/jennifer" <<'SHIM'
          #!/usr/bin/env bash
          exec docker run --rm --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/work" --workdir /work \
            --entrypoint jennifer "${JENNIFER_IMAGE}" "$@"
          SHIM
          chmod +x "$HOME/.local/bin/jennifer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Before fmt and the header guard: injection generates a .j file, and
      # both check it. On a branch this stamps <last tag>-dev+<commits>.<sha>.
      - name: Inject the version from the git tags
        run: |
          set -euo pipefail
          tools/inject-version.sh
          source tools/deck-lib.sh && deck_load
          echo "$DECK_NAME $DECK_VERSION - $DECK_MANIFEST, $DECK_SHAPE shape, tiny=$DECK_TINY"
          echo "\`$DECK_NAME\` \`$DECK_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check formatting
        # `fmt -l` lists unformatted files and exits 1 when there are any.
        run: |
          set -euo pipefail
          source tools/deck-lib.sh && deck_load
          mapfile -t sources < <(deck_all_sources)
          jennifer fmt -l "${sources[@]}"

      - name: Lint
        # Only compilable units: a topic file is `include`d, not compiled, so
        # in isolation its calls into the module read as undefined.
        run: |
          set -euo pipefail
          source tools/deck-lib.sh && deck_load
          mapfile -t units < <(deck_lint_units)
          jennifer lint "${units[@]}"

      - name: Check headers against the manifest
        run: tools/check-headers.sh

      - name: Check every module has a co-located test overlay
        run: tools/check-overlays.sh

      - name: Check the docs against the code
        # signatures, docblocks, links, and every value the guides claim
        run: tools/check-docs.sh

      - name: Run the test suites
        # One loop, so a failing file does not stop the rest from reporting.
        run: |
          set -euo pipefail
          source tools/deck-lib.sh && deck_load
          failed=0
          while read -r suite; do
            echo "::group::$suite"
            jennifer test "$suite" || failed=1
            echo "::endgroup::"
          done < <(deck_test_suites)
          exit "$failed"

      - name: Run every example
        run: tools/check-examples.sh

      - name: Repo-specific checks
        run: |
          if [[ -x tools/check-extra.sh ]]; then
            tools/check-extra.sh
          else
            echo "no tools/check-extra.sh in this deck"
          fi

  tiny:
    name: jennifer-tiny
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only decks listing jennifer-tiny in [engines] make the claim, and a
      # claim is worth making only if it is checked. No tiny container is
      # published, so this job builds the interpreter.
      - name: Does this deck claim jennifer-tiny?
        id: claim
        run: |
          source tools/deck-lib.sh && deck_load
          echo "tiny=$DECK_TINY" >> "$GITHUB_OUTPUT"

      - name: Inject the version from the git tags
        if: steps.claim.outputs.tiny == 'yes'
        run: tools/inject-version.sh

      - name: Install Jennifer and jennifer-tiny
        if: steps.claim.outputs.tiny == 'yes'
        uses: ./.github/actions/install-jennifer
        with:
          tinygo: 'true'

      - name: Exercise the deck on the constrained build
        # `jennifer test` is a development feature the constrained build does
        # not carry, so the check is that the deck loads and its examples run.
        if: steps.claim.outputs.tiny == 'yes'
        env:
          JENNIFER: jennifer-tiny
        run: tools/check-examples.sh
