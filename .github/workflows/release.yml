#
# Cut a GitHub release when a stable version tag is pushed.
#
# A deck has nothing to compile and no per-platform artifact: it is Jennifer
# source, vendored as src/. The release is the tag plus the archive jvc
# fetches, gated by the same suite test.yml runs.
#
# Release tags are stable semver only: `0.2.0` or `v0.2.0`. A prerelease tag
# (`0.2.0-rc1`) is not a release - tools/version.sh does not anchor a version
# on one, and the gate below rejects it. The tag is the source of truth for
# the version; deck.toml and src/topics/version.j are generated from it.

name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The trigger glob is loose; this is the gate. workflow_dispatch from a
      # branch lands here too and fails, which is the intent.
      - name: Tag must be a stable release
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is not a stable release tag (N.N.N or vN.N.N)"
            exit 1
          fi

      - name: Resolve the interpreter image
        run: |
          set -euo pipefail
          source tools/deck-lib.sh && deck_load
          image="$(deck_image)"
          echo "JENNIFER_IMAGE=${image}" >> "$GITHUB_ENV"
          echo "floor ${DECK_FLOOR} -> ${image}"

      - name: Pull the interpreter image
        run: docker pull "$JENNIFER_IMAGE"

      - name: Install a `jennifer` shim that runs the image
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/jennifer" <<'SHIM'
          #!/usr/bin/env bash
          exec docker run --rm --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/work" --workdir /work \
            --entrypoint jennifer "${JENNIFER_IMAGE}" "$@"
          SHIM
          chmod +x "$HOME/.local/bin/jennifer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # deck.toml's version is what jvc resolves against, read from the
      # default branch, so a tag that disagrees with it would publish the deck
      # under a number nothing else knows about.
      - name: Tag must match the manifest
        run: |
          set -euo pipefail
          source tools/deck-lib.sh && deck_load
          if [[ "${GITHUB_REF_NAME#v}" != "$DECK_VERSION" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match ${DECK_MANIFEST} version ${DECK_VERSION}"
            echo "::error::bump the manifest and commit it before tagging"
            exit 1
          fi
          echo "${DECK_NAME} ${DECK_VERSION}"

      # The generated half: d64.VERSION records the build.
      - name: Stamp src/topics/version.j
        run: tools/inject-version.sh

      - name: Check formatting
        run: |
          set -euo pipefail
          source tools/deck-lib.sh && deck_load
          mapfile -t sources < <(deck_all_sources)
          jennifer fmt -l "${sources[@]}"

      - name: Lint
        run: |
          set -euo pipefail
          source tools/deck-lib.sh && deck_load
          mapfile -t units < <(deck_lint_units)
          jennifer lint "${units[@]}"

      - name: Guards
        run: |
          tools/check-headers.sh
          tools/check-overlays.sh
          tools/check-docs.sh

      - name: Run the test suites
        run: |
          set -euo pipefail
          source tools/deck-lib.sh && deck_load
          failed=0
          while read -r suite; do
            echo "::group::$suite"
            jennifer test "$suite" || failed=1
            echo "::endgroup::"
          done < <(deck_test_suites)
          exit "$failed"

      - name: Run every example
        run: tools/check-examples.sh

      - name: Repo-specific checks
        run: |
          if [[ -x tools/check-extra.sh ]]; then
            tools/check-extra.sh
          else
            echo "no tools/check-extra.sh in this deck"
          fi

  release:
    name: Create the release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Tags for the version, and history for the notes.
          fetch-depth: 0

      - name: Build the release archive
        id: pack
        run: |
          set -euo pipefail
          tools/inject-version.sh
          source tools/deck-lib.sh && deck_load
          tools/pack.sh dist
          {
            echo "name=${DECK_NAME}"
            echo "slug=${DECK_SLUG}"
            echo "scope=${DECK_SCOPE}"
            echo "version=${DECK_VERSION}"
            echo "root=${DECK_SCOPE}-${DECK_SLUG}-${DECK_VERSION}"
            echo "manual=$(deck_field package.urls.manual)"
            echo "description=$(deck_field package.description)"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          SLUG: ${{ steps.pack.outputs.slug }}
          SCOPE: ${{ steps.pack.outputs.scope }}
          ROOT: ${{ steps.pack.outputs.root }}
          MANUAL: ${{ steps.pack.outputs.manual }}
          DESCRIPTION: ${{ steps.pack.outputs.description }}
          NAME: ${{ steps.pack.outputs.name }}
        run: |
          set -euo pipefail
          {
            echo "${DESCRIPTION}"
            echo
            echo "**Documentation:** ${MANUAL}"
            echo
            echo "**Install** - \`jvc add ${NAME}\`, or vendor the \`src/\` subtree by hand:"
            echo
            echo '```sh'
            echo "mkdir -p vendor/${SCOPE}/${SLUG}"
            echo "tar -xzf ${ROOT}.tar.gz -C vendor/${SCOPE}/${SLUG} \\"
            echo "    --strip-components=2 ${ROOT}/src"
            echo '```'
            echo
            echo "## Changes"
            echo
          } > notes.md
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [[ -n "$previous" ]]; then
            git log --no-merges --pretty='- %s' "${previous}..${GITHUB_REF_NAME}" >> notes.md
          else
            echo "- first release" >> notes.md
          fi
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${{ steps.pack.outputs.slug }} ${{ steps.pack.outputs.version }}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.tar.gz.checksum
